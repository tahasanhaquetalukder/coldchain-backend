<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColdChain IoT Monitoring Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400">ColdChain Security & IoT Dashboard</h1>
                <p class="text-slate-400 text-sm">Hackathon Project - Task 4 & 5 Live Monitoring</p>
            </div>
            <div class="bg-emerald-950 border border-emerald-500 text-emerald-300 px-4 py-2 rounded-lg text-sm font-semibold">
                System Status: SECURE
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg">
                <h3 class="text-slate-400 text-sm font-medium">Total Batches</h3>
                <p class="text-4xl font-bold text-white mt-2">2</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg">
                <h3 class="text-slate-400 text-sm font-medium">Security Protocol</h3>
                <p class="text-xl font-bold text-emerald-400 mt-2">HMAC-SHA256</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg">
                <h3 class="text-slate-400 text-sm font-medium">Integrity Chain</h3>
                <p class="text-xl font-bold text-sky-400 mt-2">Hash-Linked Active</p>
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4 text-slate-200">Quick Links & API Docs</h2>
            <div class="flex gap-4">
                <a href="/docs" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-lg font-medium transition">Open Swagger API Docs</a>
                <a href="/api/inventory" target="_blank" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-lg font-medium transition">View Inventory JSON</a>
            </div>
        </div>
    </div>
</body>
</html>
