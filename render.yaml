# Render Blueprint for the whole stack: Postgres + the FastAPI service + the static front end.
#
# If coldchain-backend already exists as a hand-created service, do NOT apply this Blueprint - it would
# create a second API with its own empty database. Either import this file as the source of truth for a
# fresh stack, or copy the envVar list into the existing services. Every secret is either generated by
# Render (generateValue) or filled in by a human in the dashboard (sync: false); none is stored here.
#
# The static site bakes VITE_API_BASE at build time, so it has to be rebuilt after you set it.
services:
  - type: web
    name: coldchain-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # ENV=production is what makes the process refuse to boot on a missing or placeholder secret.
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: coldchain-db
          property: connectionString
      # 32 random bytes, generated once by Render and never written into this file.
      - key: JWT_SECRET
        generateValue: true
      # Must equal what every node signs with. Change it here and rotate every node key from the
      # Devices page, or reflash - a mismatch shows up as "invalid signature" rejections, not an error.
      - key: HMAC_SECRET_KEY
        sync: false
      # Exactly the origin the static site is served from. No wildcards in production: the API hands
      # out session tokens, and "*" means any page can read them.
      - key: CORS_ORIGINS
        sync: false
      # The three logins. Without these the production seed refuses to run rather than creating
      # admin/admin123, so set all three before the first deploy.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_PHARMACIST_PASSWORD
        sync: false
      - key: SEED_INSPECTOR_PASSWORD
        sync: false
      # Optional door alerts. Leave both unset and alerts stay audit-log only.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Render's disk is wiped on every deploy, so the anchor file is only a same-process guard here:
      # it still catches an edited record, but not a whole-log deletion. See README "Deploy to Render".
      - key: AUDIT_ANCHOR
        value: /tmp/coldchain_audit_anchor.log

  - type: web
    name: coldchain-web
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # The app routes on the URL hash, so the QR link never reaches the server - but a typed or pasted
    # path would otherwise get Render's 404 page instead of the app.
    routes:
      - path: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The API service's real https host, no trailing slash. Set it, then rebuild: Vite reads env vars
      # at build time, so an existing bundle keeps calling whatever was baked into the last one.
      - key: VITE_API_BASE
        sync: false

databases:
  - name: coldchain-db
    databaseName: coldchain
    plan: free
    region: singapore
    # Render's free Postgres is deleted after 30 days of inactivity. A cold-chain log that has to
    # survive is worth the paid plan; the app also runs on SQLite when DATABASE_URL is unset.
    ipAllowList: []          # reachable only from services in this Blueprint and the Render network
