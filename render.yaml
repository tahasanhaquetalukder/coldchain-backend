# Reference values for the two services. coldchain-backend already exists as a hand-created
# service, so do NOT apply this as a Blueprint now: it would create a second API with its own
# empty database. Create coldchain-web by hand with the same values.
# The static site bakes VITE_API_URL at build time, so it must equal the API's real URL.
services:
  - type: web
    name: coldchain-backend-8b16   # Render appended -8b16; the plain name was taken
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Tokens die with the value, so generate once and let Render store it.
      - key: JWT_SECRET
        generateValue: true
      # Deliberately the same key simulator.py uses; change both or every reading is rejected as a bad signature.
      - key: HMAC_SECRET_KEY
        value: super-secret-hackathon-key

  - type: web
    name: coldchain-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://coldchain-backend-8b16.onrender.com
